<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" role="img" aria-label="Détecteur de radon à long terme">
  <!-- Détecteur à trace alpha générique : socle conique, capsule en deux parties, étiquette. Illustration originale, sans marque. -->
  <ellipse cx="160" cy="232" rx="124" ry="13" fill="#1a1b1d" opacity=".14"/>
  <!-- socle -->
  <path d="M40 214 L92 132 A68 13 0 0 0 228 132 L280 214 A120 22 0 0 1 40 214 Z" fill="#2a2d33"/>
  <path d="M40 214 L92 132 A68 13 0 0 0 120 142 L84 224 A120 22 0 0 1 40 214 Z" fill="#3a3e46"/>
  <path d="M228 132 L280 214 A120 22 0 0 1 252 226 L208 142 A68 13 0 0 0 228 132 Z" fill="#202328"/>
  <ellipse cx="160" cy="132" rx="68" ry="13" fill="#1d1f24"/>
  <!-- capsule -->
  <path d="M76 66 L76 120 A84 19 0 0 0 244 120 L244 66 Z" fill="#24272c"/>
  <path d="M76 66 L76 120 A84 19 0 0 0 112 135 L112 82 Z" fill="#33373e"/>
  <path d="M76 96 A84 19 0 0 0 244 96" fill="none" stroke="#14161a" stroke-width="2"/>
  <path d="M76 98 A84 19 0 0 0 244 98" fill="none" stroke="#454a52" stroke-width="1"/>
  <ellipse cx="160" cy="66" rx="84" ry="19" fill="#2e3238"/>
  <ellipse cx="160" cy="66" rx="77" ry="16.5" fill="#25282d"/>
  <!-- étiquette -->
  <ellipse cx="160" cy="66" rx="62" ry="13" fill="#f3efe7"/>
  <g transform="translate(160 66) scale(1 .21)">
    <rect x="-34" y="-46" width="68" height="7" rx="3.5" fill="#6f6f73"/>
    <rect x="-24" y="-28" width="48" height="5" rx="2.5" fill="#a6a6a8"/>
    <g fill="#1a1b1d">
      <rect x="-14" y="-12" width="6" height="6"/><rect x="-4" y="-12" width="6" height="6"/><rect x="6" y="-12" width="6" height="6"/>
      <rect x="-14" y="-2" width="6" height="6"/><rect x="2" y="-2" width="6" height="6"/>
      <rect x="-10" y="8" width="6" height="6"/><rect x="0" y="8" width="6" height="6"/><rect x="10" y="8" width="4" height="6"/>
      <rect x="-14" y="18" width="28" height="3"/>
    </g>
    <rect x="-30" y="32" width="60" height="6" rx="3" fill="#2c4160"/>
  </g>
  <!-- reflet -->
  <path d="M96 60 A70 14 0 0 1 150 49" fill="none" stroke="#fbf8f2" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
