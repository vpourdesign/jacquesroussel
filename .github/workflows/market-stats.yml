name: Statistiques de marché Centris

# Centris publie ses statistiques par trimestre, environ six semaines après la
# fin de la période. On vérifie une fois par semaine : si rien n'a bougé, le job
# ne commit rien.

on:
  schedule:
    - cron: '30 12 * * 1'   # tous les lundis, 30 min après le job quotidien
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les statistiques Centris
        run: node scripts/fetch-market-stats.mjs

      - name: Rebâtir le site avec les nouveaux chiffres
        run: node build.mjs

      - name: Commit
        run: |
          git config user.name "centris-bot"
          git config user.email "bot@jacquesroussel.com"
          git add site/
          if git diff --cached --quiet; then
            echo "Statistiques inchangées"
          else
            git commit -m "data: statistiques de marché Centris $(date -u +%Y-%m-%d)"
            git push
          fi
